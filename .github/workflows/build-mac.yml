name: Build Mac controller app
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mac.yml'
      - 'Package.swift'
      - 'build-command-line.sh'
      - 'joycontrol-macos/**'
      - 'Tests/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: bash build-command-line.sh
      - name: Test advertising readiness checks
        run: swift test -c release --arch arm64
      - name: Verify app architecture and signature
        run: |
          file build/Joycontrol.app/Contents/MacOS/joycontrol-macos
          lipo build/Joycontrol.app/Contents/MacOS/joycontrol-macos -verify_arch arm64
          codesign --verify --strict --verbose=2 build/Joycontrol.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Joycontrol.app build/Joycontrol-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Joycontrol-Apple-Silicon
          path: build/Joycontrol-arm64.zip
          retention-days: 7
